  <line x1="150" y1="185" x2="490" y2="185" stroke="#7c85f522" stroke-width="0.8" style="fill:rgb(0, 0, 0);stroke:rgba(124, 133, 245, 0.133);color:rgb(255, 255, 255);stroke-width:0.8px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Refraction lines inside left side -->
